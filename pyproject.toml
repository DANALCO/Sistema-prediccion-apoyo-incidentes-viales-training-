[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accidentes"
version = "0.1.0"
description = "Prediccion de impacto critico de incidentes viales (US Accidents): pipeline de modelado"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "pyarrow>=14",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
